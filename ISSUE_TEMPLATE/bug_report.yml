name: Bug report
description: Something does not work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form — see the security policy instead.

  - type: dropdown
    id: product
    attributes:
      label: Which product?
      options:
        - Norlay (Mac)
        - Norlay Code
        - Norlay Link Checker (NVDA add-on)
        - Website or downloads
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version or build number, from the app's About window, the release title, or NVDA's add-on list.
      placeholder: "1.1.3"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Please include the exact message you saw or heard.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy a link
        2. Press NVDA+Alt+L
        3. …
    validations:
      required: false

  - type: input
    id: system
    attributes:
      label: System
      description: Operating system version, and the screen reader and version you were using.
      placeholder: "Windows 11 24H2, NVDA 2026.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log or error text
      description: Paste any error text. Remove API keys, addresses you would rather keep private, and personal data first.
      render: text
    validations:
      required: false
